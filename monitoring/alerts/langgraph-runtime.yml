groups:
  - name: langgraph-runtime
    rules:
      - alert: LangGraphCheckpointStorageUnavailable
        expr: increase(langgraph_checkpoint_errors_total{code="langgraph_checkpoint_unavailable"}[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: LangGraph checkpoint storage is unavailable
          runbook_url: docs/runbooks/langgraph-checkpoints.md#alerts-and-triage
      - alert: LangGraphCheckpointWriteLatencyHigh
        expr: histogram_quantile(0.95, sum(rate(langgraph_checkpoint_write_latency_ms_bucket[5m])) by (le)) > 250
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Hosted checkpoint write p95 exceeds 250 ms
          runbook_url: docs/runbooks/langgraph-checkpoints.md#alerts-and-triage
      - alert: LangGraphCheckpointReadLatencyHigh
        expr: histogram_quantile(0.95, sum(rate(langgraph_checkpoint_read_latency_ms_bucket[5m])) by (le)) > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Hosted checkpoint read p95 exceeds 300 ms
          runbook_url: docs/runbooks/langgraph-checkpoints.md#alerts-and-triage
      - alert: LangGraphCheckpointCorruption
        expr: increase(langgraph_checkpoint_errors_total{code="langgraph_state_invalid"}[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: Persisted or incoming LangGraph state failed validation
          runbook_url: docs/runbooks/langgraph-checkpoints.md#alerts-and-triage
      - alert: LangGraphTenantRejectionSpike
        expr: increase(langgraph_tenant_rejections_total[5m]) >= 3
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: Repeated LangGraph tenant binding rejections detected
          runbook_url: docs/runbooks/langgraph-checkpoints.md#alerts-and-triage
      - alert: LangGraphVersionMismatch
        expr: increase(langgraph_version_mismatch_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: Active checkpoint graph or state version is unsupported
          runbook_url: docs/runbooks/langgraph-checkpoints.md#alerts-and-triage
      - alert: LangGraphPoolSaturation
        expr: langgraph_pool_waiting_requests > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: LangGraph exhausted its shared-pool connection budget
          runbook_url: docs/runbooks/langgraph-checkpoints.md#alerts-and-triage
      - alert: LangGraphStaleThreads
        expr: langgraph_stale_threads > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Active or paused graph threads have not advanced for 15 minutes
          runbook_url: docs/runbooks/langgraph-checkpoints.md#alerts-and-triage
