groups:
  - name: job-runtime
    rules:
      - alert: JobRuntimeNotAcceptingClaims
        expr: job_runtime_claims_enabled == 1 and job_runtime_accepting_claims == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Job runtime is enabled but is not accepting claims
      - alert: JobRuntimeQueueAgeSlo
        expr: job_runtime_queue_oldest_age_seconds > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Job runtime ready-to-start age exceeds two seconds
      - alert: JobRuntimePoolWaiting
        expr: job_runtime_pool_waiting_requests > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Job runtime is waiting for shared PostgreSQL connections
      - alert: JobRuntimeDeliveryFailures
        expr: increase(job_runtime_fail_total[5m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Job deliveries exhausted their bounded retry policy
      - alert: JobRuntimeUnknownVersion
        expr: increase(job_runtime_unknown_version_total[5m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: A producer submitted an unsupported job payload version
      - alert: JobRuntimeShutdownDeadline
        expr: increase(job_runtime_shutdown_deadline_total[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Job runtime exceeded its graceful shutdown deadline
      - alert: JobRuntimeRetentionFailure
        expr: increase(job_runtime_retention_failure_total[1h]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Job delivery registry retention failed
