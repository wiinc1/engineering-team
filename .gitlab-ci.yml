# GitLab CI runs on the repository's tagged macOS shell runner. Keep the
# issue-specific gates sequential so performance and load evidence is not
# distorted by concurrent jobs sharing the same host.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

default:
  tags:
    - macos
    - apple-silicon
    - shell
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

variables:
  GIT_DEPTH: "0"

stages:
  - build
  - test
  - verify
  - deploy

.node-job:
  before_script:
    - npm ci --cache .npm --prefer-offline

# Prove the repository installs, audits, compiles, and builds before the long verification job.
build:
  extends: .node-job
  stage: build
  script:
    - npm audit --omit=dev
    - npm run lint
    - npm run typecheck
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

# Run every local and issue-specific gate, including real PostgreSQL and the ten-minute 2x workload proof.
graphile-02-verify:
  extends: .node-job
  stage: test
  timeout: 45 minutes
  variables:
    NODE_OPTIONS: --max-old-space-size=8192
  script:
    - npm run job-runtime:inventory
    - npm run test:graphile:workloads
    - npm run test:graphile:coverage
    - npm run test:graphile:mutation
    - npm test
    - export COMPOSE_PROJECT_NAME="issue287-${CI_PIPELINE_ID}-${CI_JOB_ID}"
    - export POSTGRES_HOST_PORT="$((55000 + (CI_JOB_ID % 9000)))"
    - npm run test:integration:docker
    - npm run test:security
    - npm run test:performance
    - JOB_RUNTIME_LOAD_DURATION_MS=600000 JOB_RUNTIME_LOAD_QPS=50 npm run test:graphile:load
    - npm run coverage
    - npm run standards:check
    - npm run build
    - make verify
    - |
      base_sha="$(git merge-base "origin/${CI_DEFAULT_BRANCH}" "$CI_COMMIT_SHA")"
      git diff --check "$base_sha" "$CI_COMMIT_SHA"
  artifacts:
    when: always
    paths:
      - .artifacts/
      - test-results/
      - playwright-report/
    expire_in: 2 weeks

# Verify LANGGRAPH-01 after the shared-host Graphile workload has completed so
# its ten-minute latency sample is never distorted by another issue load gate.
langgraph-01-verify:
  extends: .node-job
  stage: verify
  timeout: 60 minutes
  variables:
    NODE_OPTIONS: --max-old-space-size=8192
  script:
    - npm run test:langgraph
    - npm run test:langgraph:coverage
    - npm run test:langgraph:runtime-coverage
    - npm run test:langgraph:mutation
    - npm test
    - export COMPOSE_PROJECT_NAME="issue280-${CI_PIPELINE_ID}-${CI_JOB_ID}"
    - export POSTGRES_HOST_PORT="$((46000 + (CI_JOB_ID % 9000)))"
    - npm run test:integration:docker
    - npm run test:security
    - npm run test:performance
    - LANGGRAPH_LOAD_DURATION_MS=600000 LANGGRAPH_LOAD_CONCURRENCY=4 npm run test:langgraph:load
    - npm run coverage
    - npm run standards:check
    - npm run build
    - make verify
    - |
      base_sha="$(git merge-base "origin/${CI_DEFAULT_BRANCH}" "$CI_COMMIT_SHA")"
      git diff --check "$base_sha" "$CI_COMMIT_SHA"
  artifacts:
    when: always
    paths:
      - .artifacts/
      - test-results/
      - playwright-report/
    expire_in: 2 weeks

# Preserve an explicit deploy stage without performing an automatic production mutation.
deploy-review:
  stage: deploy
  needs:
    - build
    - graphile-02-verify
    - langgraph-01-verify
  script:
    - echo "All verified artifacts are ready for an operator-owned production review."
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
    - when: never
