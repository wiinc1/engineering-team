openapi: 3.1.0
info:
  title: Job runtime compatibility components
  version: 1.0.0
  description: Components-only contract. Issue 287 adds no HTTP paths; issue 288 owns operational APIs.
paths: {}
components:
  schemas:
    JobRuntimeStableError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [job_runtime_unavailable, job_task_unknown, job_payload_invalid, job_version_unsupported, job_schedule_conflict]
        message: { type: string, maxLength: 160 }
    JobRuntimeHealth:
      type: object
      additionalProperties: false
      required: [status, state, acceptingClaims, catalogVersion]
      properties:
        status: { type: string, enum: [ok, degraded, failed] }
        state: { type: string, enum: [standby, starting, ready, draining, stopped, failed] }
        acceptingClaims: { type: boolean }
        catalogVersion: { type: integer, minimum: 1 }
